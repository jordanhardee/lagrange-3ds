name: Nintendo 3DS port - build probe

on:
  push:
    branches: [3ds-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ARM toolchain and available portlibs
        run: |
          set -euo pipefail
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/3ds/bin:$PATH"
          arm-none-eabi-gcc --version
          cmake --version
          test -f "$DEVKITPRO/cmake/3DS.cmake"
          mkdir -p port-report
          dkp-pacman -Q > port-report/installed-packages.txt
          dkp-pacman -Sl > port-report/available-packages.txt
          grep -Ei 'openssl|unistring|pcre|sdl|zlib|freetype|harfbuzz|fribidi' port-report/available-packages.txt || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule sync --recursive
          git submodule update --init lib/the_Foundation
          git config --global --add safe.directory "$GITHUB_WORKSPACE/lib/the_Foundation"

      - name: Build SDL3 for ARM (pinned upstream revision)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-3.4.20 https://github.com/libsdl-org/SDL.git /tmp/SDL3
          test "$(git -C /tmp/SDL3 rev-parse HEAD)" = f00dc919ca35b9756316e86c4777392de442f9b2
          python3 port/3ds/handheld-ui.py sdl /tmp/SDL3
          python3 port/3ds/runtime.py sdl /tmp/SDL3
          git -C /tmp/SDL3 diff > port-report/sdl3-dualscreen.patch
          cmake -S /tmp/SDL3 -B /tmp/sdl-build \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF -DSDL_DISABLE_INSTALL=OFF -DSDL_DISABLE_INSTALL_CPACK=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEVKITPRO/portlibs/3ds"
          cmake --build /tmp/sdl-build --parallel 2
          cmake --install /tmp/sdl-build

      - name: Compile and package SDL3 smoke test
        id: smoke
        run: |
          set -euo pipefail
          mkdir -p /tmp/3ds-smoke
          cat > /tmp/3ds-smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.15)
          project(lagrange_3ds_smoke C)
          find_package(SDL3 CONFIG REQUIRED)
          add_executable(lagrange-3ds-smoke main.c)
          target_link_libraries(lagrange-3ds-smoke PRIVATE SDL3::SDL3)
          ctr_generate_smdh(OUTPUT smoke.smdh NAME "Lagrange 3DS Smoke Test"
            DESCRIPTION "SDL3 build verification; not a browser" AUTHOR "Lagrange 3DS project")
          ctr_create_3dsx(lagrange-3ds-smoke SMDH smoke.smdh)
          EOF
          cat > /tmp/3ds-smoke/main.c <<'EOF'
          #include <SDL3/SDL.h>
          #include <SDL3/SDL_main.h>
          #include <3ds.h>
          int main(int argc, char **argv) {
              (void) argc; (void) argv;
              if (!SDL_Init(SDL_INIT_VIDEO)) return 1;
              SDL_Window *window = SDL_CreateWindow("Lagrange 3DS smoke test", 400, 240, 0);
              if (!window) { SDL_Quit(); return 2; }
              SDL_Renderer *renderer = SDL_CreateRenderer(window, "software");
              if (!renderer) { SDL_DestroyWindow(window); SDL_Quit(); return 3; }
              while (aptMainLoop()) {
                  SDL_Event event;
                  while (SDL_PollEvent(&event)) {
                      if (event.type == SDL_EVENT_QUIT) goto done;
                  }
                  hidScanInput();
                  if (hidKeysDown() & KEY_START) break;
                  SDL_SetRenderDrawColor(renderer, 40, 65, 48, 255);
                  SDL_RenderClear(renderer);
                  SDL_SetRenderDrawColor(renderer, 235, 223, 193, 255);
                  SDL_FRect paper = { 20, 20, 360, 200 };
                  SDL_RenderFillRect(renderer, &paper);
                  SDL_RenderPresent(renderer);
                  SDL_Delay(16);
              }
          done:
              SDL_DestroyRenderer(renderer);
              SDL_DestroyWindow(window);
              SDL_Quit();
              return 0;
          }
          EOF
          cmake -S /tmp/3ds-smoke -B /tmp/smoke-build \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/smoke-build --parallel 2
          test -s /tmp/smoke-build/lagrange-3ds-smoke.3dsx
          cp /tmp/smoke-build/lagrange-3ds-smoke.3dsx port-report/
          sha256sum port-report/*.3dsx > port-report/SHA256SUMS

      - name: Cross-compile GNU libunistring
        id: unistring
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: |
          set -euo pipefail
          (
            export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/3ds/bin:$PATH"
            prefix="$DEVKITPRO/portlibs/3ds"
            mkdir -p /tmp/lagrange-deps
            cd /tmp/lagrange-deps
            curl --fail --location --retry 3 https://ftp.gnu.org/gnu/libunistring/libunistring-1.4.2.tar.xz -o libunistring-1.4.2.tar.xz
            echo '5b46e74377ed7409c5b75e7a96f95377b095623b689d8522620927964a41499c  libunistring-1.4.2.tar.xz' | sha256sum -c -
            tar -xf libunistring-1.4.2.tar.xz
            cd libunistring-1.4.2
            # Configure found native getlocalename_l; use the libc function
            # directly for per-thread locale objects rather than a guessed name.
            python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/getlocalename_l-unsafe.c")
          s = p.read_text()
          old = "#elif defined __linux__ && HAVE_LANGINFO_H && defined NL_LOCALE_NAME"
          new = """#elif defined __3DS__ && HAVE_GETLOCALENAME_L
          # undef getlocalename_l
                extern const char *getlocalename_l (int, locale_t);
                const char *name = getlocalename_l (category, locale);
                return (struct string_with_storage) { name ? name : "", STORAGE_OBJECT };
          """ + old
          assert s.count(old) == 1, "unexpected libunistring locale source"
          p.write_text(s.replace(old, new))
          PY
            export CC=arm-none-eabi-gcc AR=arm-none-eabi-ar RANLIB=arm-none-eabi-ranlib
            export CFLAGS="-march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft -mword-relocations -O2 -ffunction-sections -fdata-sections"
            export CPPFLAGS="-D__3DS__ -I$prefix/include -I$DEVKITPRO/libctru/include"
            export LDFLAGS="$CFLAGS -specs=3dsx.specs -L$prefix/lib -L$DEVKITPRO/libctru/lib"
            export LIBS="-lctru"
            ./configure --host=arm-none-eabi --build="$(build-aux/config.guess)" \
              --prefix="$prefix" --disable-shared --enable-static --with-libiconv-prefix="$prefix"
            # The generated public stdint.h otherwise redefines uint32_t to
            # unsigned int even though devkitARM uses unsigned long. Generate
            # it first, then use the target's own fixed-width integer types.
            make -C lib unistring/stdint.h
            printf '#pragma once\n#include <stdint.h>\n' > lib/unistring/stdint.h
            make -C lib -j2
            make -C lib install
            test -s "$prefix/include/unistr.h"
            test -s "$prefix/lib/libunistring.a"
            # Check that libunistring headers do not change the target ABI.
            cat > /tmp/lagrange-deps/unistring-types.c <<'EOF'
          #include <stdint.h>
          typedef uint32_t native_u32;
          #include <unistr.h>
          _Static_assert(__builtin_types_compatible_p(native_u32, uint32_t), "uint32_t redefined");
          _Static_assert(__builtin_types_compatible_p(native_u32, ucs4_t), "Unicode type mismatch");
          EOF
            "$CC" $CFLAGS $CPPFLAGS -c /tmp/lagrange-deps/unistring-types.c -o /tmp/lagrange-deps/unistring-types.o
            arm-none-eabi-objdump -f "$prefix/lib/libunistring.a" > "$GITHUB_WORKSPACE/port-report/unistring-architecture.txt"
          ) 2>&1 | tee port-report/unistring-build.log

      - name: Cross-compile PCRE2
        id: pcre2
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: |
          set -euo pipefail
          (
            export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/3ds/bin:$PATH"
            prefix="$DEVKITPRO/portlibs/3ds"
            mkdir -p /tmp/lagrange-deps
            cd /tmp/lagrange-deps
            curl --fail --location --retry 3 https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.49/pcre2-10.49.tar.gz -o pcre2-10.49.tar.gz
            echo '929f0b20e62879252a15886b06c89f1edef61a363cbd5826fb041080a5e557ae  pcre2-10.49.tar.gz' | sha256sum -c -
            tar -xf pcre2-10.49.tar.gz
            # read_number takes int*, but newlib int32_t is long.
            # Match the local variables to the helper signature, not a pointer cast.
            python3 - <<'PY'
          from pathlib import Path
          p = Path("pcre2-10.49/src/pcre2_compile.c")
          s = p.read_text()
          old = "int32_t min = 0;\nint32_t max = REPEAT_UNLIMITED;"
          new = "int min = 0;\nint max = REPEAT_UNLIMITED;"
          assert s.count(old) == 1, "unexpected PCRE2 quantifier source"
          p.write_text(s.replace(old, new))
          PY
            cmake -S pcre2-10.49 -B pcre2-build \
              -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" \
              -DBUILD_SHARED_LIBS=OFF -DPCRE2_BUILD_PCRE2_8=ON \
              -DPCRE2_BUILD_PCRE2_16=OFF -DPCRE2_BUILD_PCRE2_32=OFF \
              -DPCRE2_SUPPORT_UNICODE=ON -DPCRE2_SUPPORT_JIT=OFF \
              -DPCRE2_BUILD_PCRE2GREP=OFF -DPCRE2_BUILD_TESTS=OFF
            cmake --build pcre2-build --parallel 2
            cmake --install pcre2-build
            "$prefix/bin/arm-none-eabi-pkg-config" --modversion libpcre2-8
            arm-none-eabi-objdump -f "$prefix/lib/libpcre2-8.a" > "$GITHUB_WORKSPACE/port-report/pcre2-architecture.txt"
          ) 2>&1 | tee port-report/pcre2-build.log

      - name: Cross-compile OpenSSL 3.5 LTS
        id: openssl
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: |
          set -euo pipefail
          (
            export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/3ds/bin:$PATH"
            prefix="$DEVKITPRO/portlibs/3ds"
            mkdir -p /tmp/lagrange-deps
            cd /tmp/lagrange-deps
            curl --fail --location --retry 3 https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz -o openssl-3.5.9.tar.gz
            echo '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  openssl-3.5.9.tar.gz' | sha256sum -c -
            tar -xf openssl-3.5.9.tar.gz
            cd openssl-3.5.9
            # libctru provides getaddrinfo, but not the legacy getservbyname
            # service database. Compile only the modern resolver on 3DS.
            python3 - <<'PY'
          from pathlib import Path
          p = Path("crypto/bio/bio_addr.c")
          s = p.read_text()
          old = "    } else {\n#endif\n        const struct hostent *he;"
          new = "#if !defined(__3DS__)\n    } else {\n#endif\n#endif\n#if !defined(__3DS__)\n        const struct hostent *he;"
          assert s.count(old) == 1, "unexpected OpenSSL lookup fallback"
          s = s.replace(old, new)
          old = "        CRYPTO_THREAD_unlock(bio_lookup_lock);\n    }\n\n    return ret;"
          new = "        CRYPTO_THREAD_unlock(bio_lookup_lock);\n#endif\n    }\n\n    return ret;"
          assert s.count(old) == 1, "unexpected OpenSSL lookup fallback ending"
          p.write_text(s.replace(old, new))
          PY
            # libctru has no SO_KEEPALIVE. Do not request it by default,
            # and report failure if a caller explicitly asks for it.
            python3 - <<'PY'
          from pathlib import Path
          p = Path("crypto/bio/bio_sock2.c")
          s = p.read_text()
          old = "\n".join(["    if (options & BIO_SOCK_KEEPALIVE) {",
                           "        if (setsockopt(sock, SOL_SOCKET, SO_KEEPALIVE,",
                           "                (const void *)&on, sizeof(on))",
                           "            != 0) {",
                           "            ERR_raise_data(ERR_LIB_SYS, get_last_socket_error(),",
                           '                "calling setsockopt()");',
                           "            ERR_raise(ERR_LIB_BIO, BIO_R_UNABLE_TO_KEEPALIVE);",
                           "            return 0;",
                           "        }",
                           "    }"])
          new = old.replace("        if (setsockopt", "#ifdef SO_KEEPALIVE\n        if (setsockopt", 1)
          new = new[:-5] + "#else\n        ERR_raise(ERR_LIB_BIO, BIO_R_UNABLE_TO_KEEPALIVE);\n        return 0;\n#endif\n    }"
          assert s.count(old) == 2, "unexpected OpenSSL keepalive blocks"
          p.write_text(s.replace(old, new))
          p = Path("crypto/bio/bss_conn.c")
          s = p.read_text()
          old = "            if (BIO_ADDRINFO_socktype(c->addr_iter) == SOCK_STREAM)\n                opts |= BIO_SOCK_KEEPALIVE;"
          assert s.count(old) == 1, "unexpected OpenSSL default keepalive"
          p.write_text(s.replace(old, "#ifdef SO_KEEPALIVE\n" + old + "\n#endif"))
          PY
            # Native OS entropy: use the ssl:C random service, as devkitPro's
            # Mbed TLS port does. Never credit bytes on a failed service call.
            python3 - <<'PY'
          from pathlib import Path
          p = Path("providers/implementations/rands/seeding/rand_unix.c")
          s = p.read_text()
          old = "#else\n\n#if defined(OPENSSL_RAND_SEED_EGD) && (defined(OPENSSL_NO_EGD) || !defined(DEVRANDOM_EGD))"
          new = """#elif defined(__3DS__)

          #ifndef OPENSSL_RAND_SEED_OS
          #error "Nintendo 3DS requires native OS entropy"
          #endif
          #include <3ds/types.h>
          #include <3ds/result.h>
          #include <3ds/synchronization.h>
          #include <3ds/services/sslc.h>

          /* libctru LightLock uses 1 as the unlocked state. Serialize the
           * sslc reference-count lifecycle even across concurrent DRBGs. */
          static LightLock entropy_lock = 1;

          size_t ossl_pool_acquire_entropy(RAND_POOL *pool)
          {
              size_t n = ossl_rand_pool_bytes_needed(pool, 1);
              unsigned char *buffer;
              Result rc;

              if (n == 0)
                  return ossl_rand_pool_entropy_available(pool);
              if (n > UINT32_MAX || n > SIZE_MAX / 8)
                  return 0;
              buffer = ossl_rand_pool_add_begin(pool, n);
              if (buffer == NULL)
                  return 0;

              LightLock_Lock(&entropy_lock);
              rc = sslcInit(0);
              if (R_SUCCEEDED(rc)) {
                  rc = sslcGenerateRandomData(buffer, (u32)n);
                  sslcExit();
              }
              LightLock_Unlock(&entropy_lock);

              if (R_FAILED(rc)) {
                  OPENSSL_cleanse(buffer, n);
                  ossl_rand_pool_add_end(pool, 0, 0);
                  return 0;
              }
              if (!ossl_rand_pool_add_end(pool, n, 8 * n)) {
                  OPENSSL_cleanse(buffer, n);
                  return 0;
              }
              return ossl_rand_pool_entropy_available(pool);
          }

          int ossl_rand_pool_init(void)
          {
              return 1;
          }

          void ossl_rand_pool_cleanup(void)
          {
          }

          void ossl_rand_pool_keep_random_devices_open(int keep)
          {
              (void)keep;
          }

          """ + old
          assert s.count(old) == 1, "unexpected OpenSSL entropy backend"
          p.write_text(s.replace(old, new))
          PY
            # 3DS has no Unix real/effective UID distinction and no
            # posix_memalign implementation. Use OpenSSL's native fallback.
            python3 - <<'PY'
          from pathlib import Path
          p = Path("crypto/uid.c")
          s = p.read_text()
          old = "|| defined(__wasi__)"
          assert s.count(old) == 1
          p.write_text(s.replace(old, old + " || defined(__3DS__)"))
          p = Path("crypto/mem.c")
          s = p.read_text()
          old = "#if defined(_BSD_SOURCE) || (defined(_POSIX_C_SOURCE) && _POSIX_C_SOURCE >= 200112L)"
          assert s.count(old) == 1
          s = s.replace(old, "#if defined(__3DS__)\n        /* Fall through to OpenSSL's portable aligned allocator. */\n#elif defined(_BSD_SOURCE) || (defined(_POSIX_C_SOURCE) && _POSIX_C_SOURCE >= 200112L)")
          p.write_text(s)
          PY
            # Generic ARM/newlib target, not a Linux target. Keep thread safety
            # and OS entropy enabled; runtime entropy and TLS need hardware validation.
            cat > Configurations/99-nintendo-3ds.conf <<'EOF'
          my %targets = (
              "nintendo-3ds" => {
                  inherit_from => [ "gcc" ],
                  thread_scheme => "pthreads",
                  ex_libs => add("-lctru -lm"),
                  cflags => "-march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft -mword-relocations -ffunction-sections -fdata-sections",
              },
          );
          EOF
            CC=arm-none-eabi-gcc AR=arm-none-eabi-ar RANLIB=arm-none-eabi-ranlib \
              perl Configure nintendo-3ds --prefix="$prefix" --libdir=lib \
                --openssldir=/3ds/lagrange/openssl \
                -D__3DS__ -DOPENSSL_USE_IPV6=0 -DOPENSSL_NO_UNIX_SOCK -DNO_SYSLOG -I"$DEVKITPRO/libctru/include" -I"$prefix/include" \
                no-shared no-dso no-module no-asm no-async no-engine no-tests no-apps \
                no-thread-pool no-ui-console no-quic --with-rand-seed=os
            # Keep compiling independent objects after errors to collect more diagnostics.
            # make still returns failure, so incomplete libraries are never installed.
            make -k -j2 build_libs
            make install_dev
            "$prefix/bin/arm-none-eabi-pkg-config" --modversion openssl
            arm-none-eabi-objdump -f "$prefix/lib/libcrypto.a" > "$GITHUB_WORKSPACE/port-report/openssl-architecture.txt"
          ) 2>&1 | tee port-report/openssl-build.log

      - name: Link OpenSSL RNG and TLS probe for Nintendo 3DS
        if: ${{ !cancelled() && steps.openssl.outcome == 'success' }}
        run: |
          set -euo pipefail
          (
            export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/3ds/bin:$PATH"
            mkdir -p /tmp/3ds-tls-probe
            cat > /tmp/3ds-tls-probe/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.15)
          project(lagrange_3ds_tls_probe C)
          set(OPENSSL_USE_STATIC_LIBS TRUE)
          find_package(OpenSSL REQUIRED)
          add_executable(lagrange-3ds-tls-probe main.c)
          target_link_libraries(lagrange-3ds-tls-probe PRIVATE OpenSSL::SSL OpenSSL::Crypto ctru m)
          target_sources(lagrange-3ds-tls-probe PRIVATE "$ENV{GITHUB_WORKSPACE}/port/3ds/pthread-tls.c")
          target_link_options(lagrange-3ds-tls-probe PRIVATE
              -Wl,--wrap=threadCreate -Wl,--wrap=threadExit
              -Wl,-u,__syscall_tls_create -Wl,-u,__syscall_tls_set
              -Wl,-u,__syscall_tls_get -Wl,-u,__syscall_tls_delete)
          ctr_create_3dsx(lagrange-3ds-tls-probe)
          EOF
            cat > /tmp/3ds-tls-probe/main.c <<'EOF'
          #include <openssl/rand.h>
          #include <openssl/ssl.h>
          extern int lagrange_3ds_tsd_selftest(void);
          int main(void)
          {
              if (lagrange_3ds_tsd_selftest() != 0) return 3;
              unsigned char random[32];
              if (RAND_bytes(random, sizeof(random)) != 1)
                  return 1;
              OPENSSL_cleanse(random, sizeof(random));
              SSL_CTX *ctx = SSL_CTX_new(TLS_client_method());
              if (ctx == NULL)
                  return 2;
              SSL_CTX_free(ctx);
              return 0;
          }
          EOF
            cmake -S /tmp/3ds-tls-probe -B /tmp/3ds-tls-build \
              -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake" \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/3ds-tls-build --parallel 2
            test -s /tmp/3ds-tls-build/lagrange-3ds-tls-probe.3dsx
            cp /tmp/3ds-tls-build/lagrange-3ds-tls-probe.3dsx port-report/
            sha256sum port-report/*.3dsx > port-report/SHA256SUMS
          ) 2>&1 | tee port-report/openssl-link.log

      - name: Adapt pinned Foundation sources to devkitARM
        id: foundation_patch
        if: ${{ !cancelled() && steps.unistring.outcome == 'success' && steps.pcre2.outcome == 'success' && steps.openssl.outcome == 'success' }}
        run: |
          set -euo pipefail
          (
            # Keep full pinned source context available in build logs for review.
            for f in src/address.c src/time.c src/fileinfo.c src/platform/posix/service.c src/platform/posix/pipe.c src/platform/posix/process.c src/platform/posix/socket.c src/platform/posix/pipe.h include/the_Foundation/process.h src/platform/posix/datagram.c; do
              echo "::group::Pinned Foundation $f"
              if [ -f "lib/the_Foundation/$f" ]; then
                cat "lib/the_Foundation/$f"
              else
                echo "Optional diagnostic source unavailable: $f"
              fi
              echo "::endgroup::"
            done
            python3 - <<'PY'
          from pathlib import Path
          root = Path("lib/the_Foundation")
          p = root / "src/address.c"
          s = p.read_text()
          assert s.count("<ifaddrs.h>") == 1, "unexpected interface discovery include"
          s = s.replace("<ifaddrs.h>", '"ifaddrs_3ds.h"')
          # The private interface header supplies the only IFF flags used.
          # libctru advertises AF_INET6 but does not implement sockaddr_in6.
          def replace_one(old, new):
              global s
              assert s.count(old) == 1, "unexpected address source: " + old
              s = s.replace(old, new)
          replace_one("#  include <net/if.h>\n", "")
          replace_one('#include "networkproxy.h"', '#undef AI_V4MAPPED_CFG\n#define AI_V4MAPPED_CFG 0\n\n#include "networkproxy.h"')
          replace_one("(d->socktype == SOCK_DGRAM ? AF_INET     : AF_UNSPEC /* v4 or v6 */)", "AF_INET")
          replace_one("        .ai_family   = AF_UNSPEC,", "        .ai_family   = AF_INET,")
          replace_one("    return sizeof(struct sockaddr_in6);", "    return d->ai_addrlen;")
          replace_one("        case AF_INET6:\n            return ((const struct sockaddr_in6 *) d->ai_addr)->sin6_port;\n", "")
          replace_one("        case AF_INET6: {\n            const struct sockaddr_in6 *s1 = (const struct sockaddr_in6 *) d->ai_addr;\n            const struct sockaddr_in6 *s2 = (const struct sockaddr_in6 *) other->ai_addr;\n            return !memcmp(&s1->sin6_addr, &s2->sin6_addr, sizeof(s1->sin6_addr));\n        }\n", "")
          replace_one("    d->info->ai_family = (sockAddrSize == sizeof(struct sockaddr_in6) ? AF_INET6 : AF_INET);", "    d->info->ai_family = ((const struct sockaddr *) sockAddr)->sa_family;")
          replace_one("                     addr->sa_family == AF_INET6 ? sizeof(struct sockaddr_in6)\n                                                 : sizeof(struct sockaddr),", "                     sizeof(struct sockaddr_in),")
          replace_one("    iString *str = new_String();\n    if (!getnameinfo(addr,", "    iString *str = new_String();\n    if (!addr || addr->sa_family != AF_INET) return str;\n    if (!getnameinfo(addr,")
          replace_one("            if (sockAddr->sa_family != AF_INET && sockAddr->sa_family != AF_INET6) continue;", "            if (sockAddr->sa_family != AF_INET) continue;")
          replace_one("            const socklen_t size = sockAddr->sa_family == AF_INET6 ? sizeof(struct sockaddr_in6)\n                                                                   : sizeof(struct sockaddr_in);", "            const socklen_t size = sizeof(struct sockaddr_in);")
          assert "struct sockaddr_in6" not in s, "remaining unsupported IPv6 structures"
          p.write_text(s)
          # No global fake socket definitions: this header is private to address.c.
          (root / "src/ifaddrs_3ds.h").write_text(r"""#pragma once
          #include <3ds/types.h>
          #include <3ds/services/soc.h>
          #include <errno.h>
          #include <stdlib.h>
          #include <string.h>
          #ifndef IFF_UP
          #define IFF_UP 0x1
          #endif
          #ifndef IFF_BROADCAST
          #define IFF_BROADCAST 0x2
          #endif
          #ifndef IFF_LOOPBACK
          #define IFF_LOOPBACK 0x8
          #endif
          #ifndef IFF_RUNNING
          #define IFF_RUNNING 0x40
          #endif
          #ifndef IFF_MULTICAST
          #define IFF_MULTICAST 0x1000
          #endif
          struct ifaddrs {
              struct ifaddrs *ifa_next;
              char *ifa_name;
              unsigned int ifa_flags;
              struct sockaddr *ifa_addr, *ifa_netmask, *ifa_broadaddr;
          };
          struct ifaddrs_3ds {
              struct ifaddrs entry;
              struct sockaddr_in ip, mask, broadcast;
              char name[5];
          };
          static inline int getifaddrs(struct ifaddrs **out)
          {
              struct in_addr ip, mask, broadcast;
              struct ifaddrs_3ds *p;
              *out = NULL;
              if (SOCU_GetIPInfo(&ip, &mask, &broadcast) != 0) {
                  errno = ENETDOWN;
                  return -1;
              }
              if (ip.s_addr == 0)
                  return 0;
              p = calloc(1, sizeof(*p));
              if (!p)
                  return -1;
              memcpy(p->name, "wlan", 5);
              p->ip.sin_family = p->mask.sin_family = p->broadcast.sin_family = AF_INET;
              p->ip.sin_addr = ip;
              p->mask.sin_addr = mask;
              p->broadcast.sin_addr = broadcast;
              p->entry.ifa_name = p->name;
              p->entry.ifa_flags = IFF_UP | IFF_RUNNING | IFF_BROADCAST;
              p->entry.ifa_addr = (struct sockaddr *)&p->ip;
              p->entry.ifa_netmask = (struct sockaddr *)&p->mask;
              p->entry.ifa_broadaddr = (struct sockaddr *)&p->broadcast;
              *out = &p->entry;
              return 0;
          }
          static inline void freeifaddrs(struct ifaddrs *p)
          {
              free(p);
          }
          """)
          p = root / "src/fileinfo.c"
          s = p.read_text()
          assert s.count("st.st_mtimespec") == 2, "unexpected file timestamp code"
          # This is a 3DS-only build-time patch. Newlib uses st_mtim.
          p.write_text(s.replace("st.st_mtimespec", "st.st_mtim"))
          p = root / "src/time.c"
          s = p.read_text()
          old = "tm->tm_gmtoff = date->gmtOffsetSeconds;"
          assert s.count(old) == 1, "unexpected tm offset assignment"
          s = s.replace(old, "/* newlib struct tm cannot store a UTC offset. */\n    (void)date->gmtOffsetSeconds;")
          old = "d->gmtOffsetSeconds = t->tm_gmtoff;"
          assert s.count(old) == 1, "unexpected tm offset extraction"
          # Use libc's local time offset formatting rather than a fake member.
          # tm_isdst is provided by the caller. Explicit offset round-trips
          # and local-time behavior remain a hardware validation item.
          s = s.replace(old, """{
                  char zone[16] = {0};
                  int hours = 0, minutes = 0;
                  d->gmtOffsetSeconds = 0;
                  if (strftime(zone, sizeof(zone), "%z", t) == 5 &&
                      (zone[0] == '+' || zone[0] == '-') &&
                      zone[1] >= '0' && zone[1] <= '9' &&
                      zone[2] >= '0' && zone[2] <= '9' &&
                      zone[3] >= '0' && zone[3] <= '9' &&
                      zone[4] >= '0' && zone[4] <= '9') {
                      hours = (zone[1] - '0') * 10 + zone[2] - '0';
                      minutes = (zone[3] - '0') * 10 + zone[4] - '0';
                      d->gmtOffsetSeconds = (zone[0] == '-' ? -1 : 1) *
                                            (hours * 3600 + minutes * 60);
                  }
              }""")
          p.write_text(s)
          p = root / "src/platform/posix/service.c"
          s = p.read_text()
          old = "listen(d->fd, SOMAXCONN)"
          assert s.count(old) == 1, "unexpected listen backlog"
          p.write_text(s.replace(old, "listen(d->fd, 8)"))
          # 3DS cannot launch Unix child processes. Follow Foundation's
          # existing Emscripten approach and explicitly fail start requests.
          p = root / "src/platform/posix/process.c"
          s = p.read_text()
          def replace_process(old, new):
              global s
              assert s.count(old) == 1, "unexpected process source: " + old
              s = s.replace(old, new)
          replace_process("#if !defined (iPlatformAndroid) && !defined (iPlatformEmscripten)", "#if !defined (iPlatformAndroid) && !defined (iPlatformEmscripten) && !defined (__3DS__)")
          replace_process("#elif defined (iPlatformEmscripten)\n    /* Browsers cannot start processes. */", "#elif defined (__3DS__)\n    d->exitStatus = -1;\n    errno = ENOSYS;\n    return iFalse;\n#elif defined (iPlatformEmscripten)\n    /* Browsers cannot start processes. */")
          replace_process("    if (d->pid) {\n        /* Allow zombies to terminate. */\n        int status = 0;\n        waitpid(d->pid, &status, WNOHANG);\n    }", "#ifndef __3DS__\n    if (d->pid) {\n        /* Allow zombies to terminate. */\n        int status = 0;\n        waitpid(d->pid, &status, WNOHANG);\n    }\n#endif")
          replace_process("    if (!d->pid) return;\n    closeInput_Pipe(&d->pin); /* no more input */", "#ifdef __3DS__\n    iUnused(d);\n#else\n    if (!d->pid) return;\n    closeInput_Pipe(&d->pin); /* no more input */")
          replace_process("    d->pid = 0;\n}\n\nsize_t writeInput_Process", "    d->pid = 0;\n#endif\n}\n\nsize_t writeInput_Process")
          # No child process I/O on this platform: don't allocate three
          # wakeup socket pairs for an operation that cannot be started.
          replace_process("    init_Pipe(&d->pin);\n    init_Pipe(&d->pout);\n    init_Pipe(&d->perr);", "#ifdef __3DS__\n    d->pin.fds[0] = d->pin.fds[1] = -1;\n    d->pout.fds[0] = d->pout.fds[1] = -1;\n    d->perr.fds[0] = d->perr.fds[1] = -1;\n#else\n    init_Pipe(&d->pin);\n    init_Pipe(&d->pout);\n    init_Pipe(&d->perr);\n#endif")
          p.write_text(s)

          # Socket-backed wakeup pipe: the socket/service/datagram threads
          # need descriptors usable with libctru poll/select. No LAN listener.
          # Retain the original file's copyright and license header.
          p = root / "src/platform/posix/pipe.c"
          s = p.read_text()
          anchor = "iDefineTypeConstruction(Pipe)\n"
          assert s.count(anchor) == 1, "unexpected Foundation pipe source"
          s = s.replace(anchor, r"""#include <sys/socket.h>
          #include <netinet/in.h>
          #include <arpa/inet.h>
          #include <poll.h>

          iDefineTypeConstruction(Pipe)

          /* Make a private TCP socket pair on 127.0.0.1, not INADDR_ANY.
           * Use ephemeral ports, check the accepted peer, and never leave
           * a listening socket open after creation. No socketpair on 3DS. */
          static int makeWakePair_3ds_(int fds[2]) {
              int listener = -1, writer = -1, reader = -1;
              int saved = 0, rc, err = 0;
              struct sockaddr_in addr = {0}, local = {0}, peer = {0};
              socklen_t n = sizeof(addr);
              fds[0] = fds[1] = -1;
              addr.sin_family = AF_INET;
              addr.sin_addr.s_addr = htonl(INADDR_LOOPBACK);
              listener = socket(AF_INET, SOCK_STREAM, IPPROTO_TCP);
              if (listener < 0) goto fail;
              if (bind(listener, (struct sockaddr *)&addr, sizeof(addr)) != 0 ||
                  listen(listener, 1) != 0 ||
                  getsockname(listener, (struct sockaddr *)&addr, &n) != 0)
                  goto fail;
              if (addr.sin_family != AF_INET ||
                  addr.sin_addr.s_addr != htonl(INADDR_LOOPBACK) || addr.sin_port == 0) {
                  errno = EADDRNOTAVAIL;
                  goto fail;
              }
              if (fcntl(listener, F_SETFL, O_NONBLOCK) != 0) goto fail;
              writer = socket(AF_INET, SOCK_STREAM, IPPROTO_TCP);
              if (writer < 0 || fcntl(writer, F_SETFL, O_NONBLOCK) != 0) goto fail;
              rc = connect(writer, (struct sockaddr *)&addr, sizeof(addr));
              if (rc != 0) {
                  if (errno != EINPROGRESS && errno != EWOULDBLOCK && errno != EAGAIN)
                      goto fail;
                  struct pollfd pending = { .fd = writer, .events = POLLOUT };
                  rc = poll(&pending, 1, 2000);
                  if (rc <= 0) { if (rc == 0) errno = ETIMEDOUT; goto fail; }
                  n = sizeof(err);
                  if (getsockopt(writer, SOL_SOCKET, SO_ERROR, &err, &n) != 0)
                      goto fail;
                  if (err != 0) { errno = err; goto fail; }
              }
              n = sizeof(local);
              if (getsockname(writer, (struct sockaddr *)&local, &n) != 0)
                  goto fail;
              struct pollfd ready = { .fd = listener, .events = POLLIN };
              rc = poll(&ready, 1, 2000);
              if (rc <= 0) { if (rc == 0) errno = ETIMEDOUT; goto fail; }
              n = sizeof(peer);
              reader = accept(listener, (struct sockaddr *)&peer, &n);
              if (reader < 0) goto fail;
              if (local.sin_family != AF_INET || peer.sin_family != AF_INET ||
                  local.sin_addr.s_addr != htonl(INADDR_LOOPBACK) ||
                  peer.sin_addr.s_addr != local.sin_addr.s_addr ||
                  peer.sin_port != local.sin_port) {
                  errno = ECONNABORTED;
                  goto fail;
              }
              if (fcntl(reader, F_SETFL, O_NONBLOCK) != 0) goto fail;
              close(listener);
              fds[0] = reader;
              fds[1] = writer;
              return 0;
          fail:
              saved = errno;
              if (reader >= 0) close(reader);
              if (writer >= 0) close(writer);
              if (listener >= 0) close(listener);
              errno = saved;
              return -1;
          }
          """)
          old = """#if defined (iHavePipe2)
              if (pipe2(d->fds, O_CLOEXEC)) {
          #else
              if (pipe(d->fds)) {
          #endif"""
          assert s.count(old) == 1, "unexpected pipe initialization"
          s = s.replace(old, "    if (makeWakePair_3ds_(d->fds)) {")
          old = """#if !defined (iHavePipe2)
              fcntl(d->fds[0], F_SETFD, FD_CLOEXEC);
              fcntl(d->fds[1], F_SETFD, FD_CLOEXEC);
          #endif"""
          assert s.count(old) == 1, "unexpected pipe close-on-exec"
          s = s.replace(old, "")
          old = "    return write(input_Pipe(d), data, size);"
          assert s.count(old) == 1
          s = s.replace(old, """    if (input_Pipe(d) < 0) { errno = EBADF; return 0; }
              ssize_t n;
              do { n = send(input_Pipe(d), data, size, 0); } while (n < 0 && errno == EINTR);
              /* Every current network wakeup is one byte. A full send queue
               * already contains wakeups; don't block holding a mutex. */
              if (n < 0 && size == 1 && (errno == EAGAIN || errno == EWOULDBLOCK))
                  return 1;
              if (n < 0) {
                  iWarning("[pipe] wakeup send failed: %i %s\\n", errno, strerror(errno));
                  return 0;
              }
              return (size_t)n;""")
          old = "    return read(output_Pipe(d), data_out, size);"
          assert s.count(old) == 1
          s = s.replace(old, """    if (output_Pipe(d) < 0) { errno = EBADF; return 0; }
              ssize_t n;
              do { n = recv(output_Pipe(d), data_out, size, 0); } while (n < 0 && errno == EINTR);
              return n < 0 ? 0 : (size_t)n;""")
          p.write_text(s)

          # The SDL3 3DS backend mounts romfs but does not initialize SOC.
          # Do it before Foundation starts creating sockets and stop it
          # only after its networking threads have been torn down.
          p = Path("app/src/main.c")
          s = p.read_text()
          old = "#include <signal.h>\n"
          assert s.count(old) == 1
          s = s.replace(old, old + """
          #ifdef __3DS__
          #include <3ds/types.h>
          #include <3ds/services/soc.h>
          #include <malloc.h>
          #include <stdlib.h>
          static u32 *socBuffer_;
          static int initSoc_3ds_(void) {
              socBuffer_ = memalign(0x1000, 0x100000);
              if (!socBuffer_) return 0;
              if (socInit(socBuffer_, 0x100000) != 0) {
                  free(socBuffer_);
                  socBuffer_ = NULL;
                  return 0;
              }
              return 1;
          }
          static void exitSoc_3ds_(void) {
              if (socBuffer_) {
                  socExit();
                  free(socBuffer_);
                  socBuffer_ = NULL;
              }
          }
          #endif
          """)
          old = "int main(int argc, char **argv) {\n"
          assert s.count(old) == 1
          s = s.replace(old, old + "#ifdef __3DS__\n    if (!initSoc_3ds_()) {\n        fprintf(stderr, \"[3DS] SOC initialization failed\\n\");\n        return 1;\n    }\n#endif\n")
          old = "        deinit_Foundation();\n        return -1;"
          assert s.count(old) == 1
          s = s.replace(old, "        deinit_Foundation();\n#ifdef __3DS__\n        exitSoc_3ds_();\n#endif\n        return -1;")
          old = "    deinit_Foundation();\n    return 0;"
          assert s.count(old) == 1
          s = s.replace(old, "    deinit_Foundation();\n#ifdef __3DS__\n    exitSoc_3ds_();\n#endif\n    return 0;")
          p.write_text(s)
          PY
            python3 port/3ds/handheld-ui.py app .
            python3 port/3ds/runtime.py app .
            git diff -- app > port-report/lagrange-handheld-ui.patch
            # Add static transitive dependencies explicitly, without rewriting
            # desktop library names or adding unresolved host libraries.
            cat >> CMakeLists.txt <<'EOF'

          # Nintendo 3DS build-only linkage additions.
          find_library(N3DS_ICONV NAMES iconv REQUIRED)
          set_property(TARGET the_Foundation APPEND PROPERTY INTERFACE_LINK_LIBRARIES "${N3DS_ICONV}")
          if(TARGET app)
              find_package(PNG REQUIRED)
              find_package(BZip2 REQUIRED)
              target_link_libraries(app PUBLIC PNG::PNG BZip2::BZip2)
              target_sources(app PRIVATE "${CMAKE_SOURCE_DIR}/port/3ds/pthread-tls.c")
              target_link_options(app PRIVATE
                  -Wl,--wrap=threadCreate -Wl,--wrap=threadExit
                  -Wl,-u,__syscall_tls_create -Wl,-u,__syscall_tls_set
                  -Wl,-u,__syscall_tls_get -Wl,-u,__syscall_tls_delete)
              # The archive is generated at CMake configuration time.
              set(N3DS_ROMFS "${CMAKE_BINARY_DIR}/lagrange-romfs")
              file(MAKE_DIRECTORY "${N3DS_ROMFS}")
              configure_file("${CMAKE_BINARY_DIR}/app/resources.lgr"
                             "${N3DS_ROMFS}/resources.lgr" COPYONLY)
              target_compile_definitions(app PRIVATE LAGRANGE_EMB_BIN="romfs:/resources.lgr")
              ctr_generate_smdh(OUTPUT "${CMAKE_BINARY_DIR}/lagrange.smdh"
                                NAME "Lagrange" DESCRIPTION "Gemini browser - experimental 3DS port"
                                AUTHOR "Lagrange contributors")
              ctr_create_3dsx(lagrange_3dsx TARGET app OUTPUT "${CMAKE_BINARY_DIR}/lagrange.3dsx"
                              SMDH "${CMAKE_BINARY_DIR}/lagrange.smdh" ROMFS "${N3DS_ROMFS}")
          endif()
          EOF
            echo "::group::Foundation process and pipe consumers"
            git grep -n -E '(_Process|_Pipe)\(' -- app lib/core || true
            grep -R -n -E '(_Process|_Pipe)\(' lib/the_Foundation/src || true
            echo "::endgroup::"
            git -C lib/the_Foundation diff > port-report/foundation-3ds.patch
            cp lib/the_Foundation/src/ifaddrs_3ds.h port-report/
          ) 2>&1 | tee port-report/foundation-patch.log

      - name: Build Lagrange with Foundation platform adaptations
        if: ${{ !cancelled() && steps.foundation_patch.outcome == 'success' }}
        run: |
          set -euo pipefail
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/3ds/bin:$PATH"
          export PKG_CONFIG_PATH=
          export PKG_CONFIG_LIBDIR="$DEVKITPRO/portlibs/3ds/lib/pkgconfig:$DEVKITPRO/portlibs/armv6k/lib/pkgconfig"
          cmake -S . -B /tmp/lagrange-3ds-build \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_STATIC=OFF \
            -DENABLE_GUI=ON -DENABLE_TUI=OFF -DINSTALL_GMGET=OFF \
            -DENABLE_X11_XLIB=OFF -DENABLE_HARFBUZZ=OFF \
            -DENABLE_IPC=OFF -DENABLE_DOWNLOAD_EDIT=OFF -DENABLE_FILE_REVEAL=OFF \
            -DENABLE_RELATIVE_EMBED=ON \
            -DENABLE_MOBILE_HANDHELD=ON -DENABLE_POPUP_MENUS=OFF \
            -DUNISTRING_DIR="$DEVKITPRO/portlibs/3ds" \
            2>&1 | tee port-report/lagrange-configure.log
          # The toolchain and target portlibs already supply static archives.
          # Avoid upstream's desktop-specific archive-name rewriting.
          # Record the relevant pinned Foundation source for porting analysis.
          cp lib/the_Foundation/src/address.c port-report/foundation-address.c
          grep -n -E 'ifaddrs|getifaddrs|freeifaddrs|AF_INET6|sockaddr_in6|socketpair|pipe\(' lib/the_Foundation/src/*.c > port-report/foundation-platform-apis.txt || true
          cmake --build /tmp/lagrange-3ds-build --target lagrange_3dsx --parallel 2 -- -k \
            2>&1 | tee port-report/lagrange-build.log
          test -s /tmp/lagrange-3ds-build/lagrange.3dsx
          mkdir -p port-report/browser
          cp /tmp/lagrange-3ds-build/lagrange.3dsx port-report/browser/
          cp /tmp/lagrange-3ds-build/app/lagrange.elf port-report/browser/
          arm-none-eabi-nm -g port-report/browser/lagrange.elf > port-report/browser-symbols.txt
          for symbol in __syscall_tls_create __syscall_tls_set __syscall_tls_get __syscall_tls_delete; do
            grep -Eq "^[0-9a-fA-F]+ T $symbol$" port-report/browser-symbols.txt
          done
          sha256sum port-report/browser/* > port-report/browser/SHA256SUMS

      - name: Upload diagnostics and smoke-test binary if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-port-probe
          path: port-report/
          if-no-files-found: warn
          retention-days: 14

  emulator-launch:
    name: Experimental Azahar first-frame smoke test
    needs: probe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download browser from this exact build
        uses: actions/download-artifact@v4
        with:
          name: 3ds-port-probe
          path: port-report
      - name: Launch pinned emulator with an empty virtual SD
        run: |
          set -euo pipefail
          mkdir -p emulator-report
          export OUT="$PWD/emulator-report"
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libegl1 libopengl0 libglx0 libvulkan1 mesa-vulkan-drivers libxcb-cursor0 libxkbcommon-x11-0 libxcb-xkb1 libxcb-icccm4 libxcb-keysyms1 libxcb-xinerama0 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libjack-jackd2-0 libpulse0 libasound2t64 imagemagick
          export ROM="$PWD/port-report/browser/lagrange.3dsx"
          test -s "$ROM"
          sha256sum "$ROM" > "$OUT/browser.sha256"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/lagrange-azahar/config"
          export XDG_DATA_HOME="$RUNNER_TEMP/lagrange-azahar/data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/lagrange-azahar/cache"
          mkdir -p "$XDG_CONFIG_HOME/azahar-emu" "$XDG_DATA_HOME" "$XDG_CACHE_HOME"
          cat > "$XDG_CONFIG_HOME/azahar-emu/qt-config.ini" <<'INI'
          [Miscellaneous]
          log_filter=*:Info Debug.Emulated:Debug
          log_filter\default=false
          [Data Storage]
          use_virtual_sd=true
          use_virtual_sd\default=false
          [UI]
          first_start=false
          first_start\default=false
          callout_flags=4294967295
          callout_flags\default=false
          pause_when_in_background=false
          pause_when_in_background\default=false
          INI
          cd "$RUNNER_TEMP"
          curl --fail --location --retry 3 -o azahar.AppImage https://github.com/azahar-emu/azahar/releases/download/2127.0.1/azahar.AppImage
          echo '496501b49b6b90b474047bb70de218e704e3681e42884e015be40001efb99442  azahar.AppImage' | sha256sum -c
          chmod +x azahar.AppImage
          ./azahar.AppImage --appimage-extract > "$OUT/appimage-extract.log"
          export EMULATOR="$PWD/squashfs-root/AppRun"
          # Resolve AppImage libraries before starting the guest. The previous
          # failure was a missing host libOpenGL.so.0, not a guest crash.
          export LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib:$PWD/squashfs-root/usr/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ldd "$PWD/squashfs-root/AppRun.wrapped" | tee "$OUT/host-library-check.txt"
          if grep -q "not found" "$OUT/host-library-check.txt"; then
            echo "::error::Emulator host dependencies unresolved"
            exit 1
          fi
          export LIBGL_ALWAYS_SOFTWARE=1 QT_QPA_PLATFORM=xcb
          xvfb-run -a -s '-screen 0 1280x1024x24' bash <<'SCRIPT'
          set -euo pipefail
          "$EMULATOR" "$ROM" > "$OUT/azahar-console.log" 2>&1 &
          pid=$!
          cleanup() {
            timeout 5s import -window root "$OUT/screenshot.png" 2>/dev/null || true
            # Azahar can block on a modal guest exception. Capture diagnostics
            # before stopping it and never wait indefinitely on that dialog.
            find "$XDG_DATA_HOME" -name azahar_log.txt -exec cp {} "$OUT/azahar_log.txt" \; || true
            find "$XDG_DATA_HOME" -name startup.log -exec cp {} "$OUT/guest-startup.log" \; || true
            find "$XDG_DATA_HOME" -maxdepth 6 -type d > "$OUT/virtual-sd-directories.txt" || true
            kill -TERM "$pid" 2>/dev/null || true
            sleep 1
            kill -KILL "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            for log in "$OUT/azahar-console.log" "$OUT/azahar_log.txt" "$OUT/guest-startup.log"; do
              if test -f "$log"; then
                echo "::group::$(basename "$log")"
                tail -n 150 "$log" || true
                echo "::endgroup::"
              fi
            done
          }
          trap cleanup EXIT
          for i in $(seq 1 90); do
            if ! kill -0 "$pid" 2>/dev/null; then
              rc=0
              wait "$pid" || rc=$?
              echo "::error::Emulator exited with status $rc before guest first-frame proof"
              exit 1
            fi
            startup="$XDG_DATA_HOME/azahar-emu/sdmc/3ds/lagrange/cache/startup.log"
            proof="$XDG_DATA_HOME/azahar-emu/sdmc/3ds/lagrange/cache/first-frame.ok"
            if test -f "$startup" && grep -Eq 'LAGRANGE_3DS_(TSD|TLS)_FAILED' "$startup"; then
              echo "::error::Guest thread-local storage or TLS initialization failed; see guest-startup.log"
              exit 1
            fi
            if test -f "$proof" && grep -q LAGRANGE_3DS_FIRST_FRAME "$proof" &&
               test -f "$startup" && grep -q LAGRANGE_3DS_TSD_OK "$startup" &&
               grep -q LAGRANGE_3DS_TLS_CONTEXT_OK "$startup" &&
               grep -q LAGRANGE_3DS_CIPHERS_OK "$startup"; then
              sleep 3
              kill -0 "$pid"
              test -d "$XDG_DATA_HOME/azahar-emu/sdmc/3ds/lagrange/downloads"
              test -d "$XDG_DATA_HOME/azahar-emu/sdmc/3ds/lagrange/cache"
              echo 'Guest reached dual-screen framebuffer update and created virtual SD storage.' | tee "$OUT/result.txt"
              exit 0
            fi
            sleep 1
          done
          echo "::error::No guest first-frame marker; inspect emulator logs and screenshot before attributing failure to Lagrange"
          exit 1
          SCRIPT
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-emulator-launch
          path: emulator-report/
          if-no-files-found: warn
          retention-days: 14

