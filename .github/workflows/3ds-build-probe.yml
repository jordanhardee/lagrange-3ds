name: Nintendo 3DS port - build probe

on:
  push:
    branches: [3ds-dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM
    steps:
      - uses: actions/checkout@v4
      - name: Inspect ARM toolchain and available portlibs
        run: |
          set -euo pipefail
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/3ds/bin:$PATH"
          arm-none-eabi-gcc --version
          cmake --version
          test -f "$DEVKITPRO/cmake/3DS.cmake"
          mkdir -p port-report
          dkp-pacman -Q > port-report/installed-packages.txt
          dkp-pacman -Sl > port-report/available-packages.txt
          grep -Ei 'openssl|unistring|pcre|sdl|zlib|freetype|harfbuzz|fribidi' port-report/available-packages.txt || true
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule sync --recursive
          git submodule update --init lib/the_Foundation
          git config --global --add safe.directory "$GITHUB_WORKSPACE/lib/the_Foundation"

      - name: Build SDL3 for ARM (pinned upstream revision)
        run: |
          set -euo pipefail
          git clone --depth 1 --branch release-3.4.20 https://github.com/libsdl-org/SDL.git /tmp/SDL3
          test "$(git -C /tmp/SDL3 rev-parse HEAD)" = f00dc919ca35b9756316e86c4777392de442f9b2
          cmake -S /tmp/SDL3 -B /tmp/sdl-build \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DSDL_SHARED=OFF -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF -DSDL_DISABLE_INSTALL=OFF -DSDL_DISABLE_INSTALL_CPACK=OFF \
            -DCMAKE_INSTALL_PREFIX="$DEVKITPRO/portlibs/3ds"
          cmake --build /tmp/sdl-build --parallel 2
          cmake --install /tmp/sdl-build

      - name: Compile and package SDL3 smoke test
        id: smoke
        run: |
          set -euo pipefail
          mkdir -p /tmp/3ds-smoke
          cat > /tmp/3ds-smoke/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.15)
          project(lagrange_3ds_smoke C)
          find_package(SDL3 CONFIG REQUIRED)
          add_executable(lagrange-3ds-smoke main.c)
          target_link_libraries(lagrange-3ds-smoke PRIVATE SDL3::SDL3)
          ctr_generate_smdh(OUTPUT smoke.smdh NAME "Lagrange 3DS Smoke Test"
            DESCRIPTION "SDL3 build verification; not a browser" AUTHOR "Lagrange 3DS project")
          ctr_create_3dsx(lagrange-3ds-smoke SMDH smoke.smdh)
          EOF
          cat > /tmp/3ds-smoke/main.c <<'EOF'
          #include <SDL3/SDL.h>
          #include <SDL3/SDL_main.h>
          #include <3ds.h>
          int main(int argc, char **argv) {
              (void) argc; (void) argv;
              if (!SDL_Init(SDL_INIT_VIDEO)) return 1;
              SDL_Window *window = SDL_CreateWindow("Lagrange 3DS smoke test", 400, 240, 0);
              if (!window) { SDL_Quit(); return 2; }
              SDL_Renderer *renderer = SDL_CreateRenderer(window, "software");
              if (!renderer) { SDL_DestroyWindow(window); SDL_Quit(); return 3; }
              while (aptMainLoop()) {
                  SDL_Event event;
                  while (SDL_PollEvent(&event)) {
                      if (event.type == SDL_EVENT_QUIT) goto done;
                  }
                  hidScanInput();
                  if (hidKeysDown() & KEY_START) break;
                  SDL_SetRenderDrawColor(renderer, 40, 65, 48, 255);
                  SDL_RenderClear(renderer);
                  SDL_SetRenderDrawColor(renderer, 235, 223, 193, 255);
                  SDL_FRect paper = { 20, 20, 360, 200 };
                  SDL_RenderFillRect(renderer, &paper);
                  SDL_RenderPresent(renderer);
                  SDL_Delay(16);
              }
          done:
              SDL_DestroyRenderer(renderer);
              SDL_DestroyWindow(window);
              SDL_Quit();
              return 0;
          }
          EOF
          cmake -S /tmp/3ds-smoke -B /tmp/smoke-build \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/smoke-build --parallel 2
          test -s /tmp/smoke-build/lagrange-3ds-smoke.3dsx
          cp /tmp/smoke-build/lagrange-3ds-smoke.3dsx port-report/
          sha256sum port-report/*.3dsx > port-report/SHA256SUMS

      - name: Cross-compile GNU libunistring
        id: unistring
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: |
          set -euo pipefail
          (
            export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/3ds/bin:$PATH"
            prefix="$DEVKITPRO/portlibs/3ds"
            mkdir -p /tmp/lagrange-deps
            cd /tmp/lagrange-deps
            curl --fail --location --retry 3 https://ftp.gnu.org/gnu/libunistring/libunistring-1.4.2.tar.xz -o libunistring-1.4.2.tar.xz
            echo '5b46e74377ed7409c5b75e7a96f95377b095623b689d8522620927964a41499c  libunistring-1.4.2.tar.xz' | sha256sum -c -
            tar -xf libunistring-1.4.2.tar.xz
            cd libunistring-1.4.2
            # Configure found native getlocalename_l; use the libc function
            # directly for per-thread locale objects rather than a guessed name.
            python3 - <<'PY'
          from pathlib import Path
          p = Path("lib/getlocalename_l-unsafe.c")
          s = p.read_text()
          old = "#elif defined __linux__ && HAVE_LANGINFO_H && defined NL_LOCALE_NAME"
          new = """#elif defined __3DS__ && HAVE_GETLOCALENAME_L
          # undef getlocalename_l
                extern const char *getlocalename_l (int, locale_t);
                const char *name = getlocalename_l (category, locale);
                return (struct string_with_storage) { name ? name : "", STORAGE_OBJECT };
          """ + old
          assert s.count(old) == 1, "unexpected libunistring locale source"
          p.write_text(s.replace(old, new))
          PY
            export CC=arm-none-eabi-gcc AR=arm-none-eabi-ar RANLIB=arm-none-eabi-ranlib
            export CFLAGS="-march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft -mword-relocations -O2 -ffunction-sections -fdata-sections"
            export CPPFLAGS="-D__3DS__ -I$prefix/include -I$DEVKITPRO/libctru/include"
            export LDFLAGS="$CFLAGS -specs=3dsx.specs -L$prefix/lib -L$DEVKITPRO/libctru/lib"
            export LIBS="-lctru"
            ./configure --host=arm-none-eabi --build="$(build-aux/config.guess)" \
              --prefix="$prefix" --disable-shared --enable-static --with-libiconv-prefix="$prefix"
            make -C lib -j2
            make -C lib install
            test -s "$prefix/include/unistr.h"
            test -s "$prefix/lib/libunistring.a"
            arm-none-eabi-objdump -f "$prefix/lib/libunistring.a" > "$GITHUB_WORKSPACE/port-report/unistring-architecture.txt"
          ) 2>&1 | tee port-report/unistring-build.log

      - name: Cross-compile PCRE2
        id: pcre2
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: |
          set -euo pipefail
          (
            export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/3ds/bin:$PATH"
            prefix="$DEVKITPRO/portlibs/3ds"
            mkdir -p /tmp/lagrange-deps
            cd /tmp/lagrange-deps
            curl --fail --location --retry 3 https://github.com/PCRE2Project/pcre2/releases/download/pcre2-10.49/pcre2-10.49.tar.gz -o pcre2-10.49.tar.gz
            echo '929f0b20e62879252a15886b06c89f1edef61a363cbd5826fb041080a5e557ae  pcre2-10.49.tar.gz' | sha256sum -c -
            tar -xf pcre2-10.49.tar.gz
            # read_number takes int*, but newlib int32_t is long.
            # Match the local variables to the helper signature, not a pointer cast.
            python3 - <<'PY'
          from pathlib import Path
          p = Path("pcre2-10.49/src/pcre2_compile.c")
          s = p.read_text()
          old = "int32_t min = 0;\nint32_t max = REPEAT_UNLIMITED;"
          new = "int min = 0;\nint max = REPEAT_UNLIMITED;"
          assert s.count(old) == 1, "unexpected PCRE2 quantifier source"
          p.write_text(s.replace(old, new))
          PY
            cmake -S pcre2-10.49 -B pcre2-build \
              -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake" \
              -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$prefix" \
              -DBUILD_SHARED_LIBS=OFF -DPCRE2_BUILD_PCRE2_8=ON \
              -DPCRE2_BUILD_PCRE2_16=OFF -DPCRE2_BUILD_PCRE2_32=OFF \
              -DPCRE2_SUPPORT_UNICODE=ON -DPCRE2_SUPPORT_JIT=OFF \
              -DPCRE2_BUILD_PCRE2GREP=OFF -DPCRE2_BUILD_TESTS=OFF
            cmake --build pcre2-build --parallel 2
            cmake --install pcre2-build
            "$prefix/bin/arm-none-eabi-pkg-config" --modversion libpcre2-8
            arm-none-eabi-objdump -f "$prefix/lib/libpcre2-8.a" > "$GITHUB_WORKSPACE/port-report/pcre2-architecture.txt"
          ) 2>&1 | tee port-report/pcre2-build.log

      - name: Cross-compile OpenSSL 3.5 LTS
        id: openssl
        if: ${{ !cancelled() && steps.smoke.outcome == 'success' }}
        run: |
          set -euo pipefail
          (
            export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/3ds/bin:$PATH"
            prefix="$DEVKITPRO/portlibs/3ds"
            mkdir -p /tmp/lagrange-deps
            cd /tmp/lagrange-deps
            curl --fail --location --retry 3 https://github.com/openssl/openssl/releases/download/openssl-3.5.9/openssl-3.5.9.tar.gz -o openssl-3.5.9.tar.gz
            echo '603f5602e2eef00d77fbd429d34dcd5822bb301757a1bc9cdb24c670f1eb859a  openssl-3.5.9.tar.gz' | sha256sum -c -
            tar -xf openssl-3.5.9.tar.gz
            cd openssl-3.5.9
            # libctru provides getaddrinfo, but not the legacy getservbyname
            # service database. Compile only the modern resolver on 3DS.
            python3 - <<'PY'
          from pathlib import Path
          p = Path("crypto/bio/bio_addr.c")
          s = p.read_text()
          old = "    } else {\n#endif\n        const struct hostent *he;"
          new = "#if !defined(__3DS__)\n    } else {\n#endif\n#endif\n#if !defined(__3DS__)\n        const struct hostent *he;"
          assert s.count(old) == 1, "unexpected OpenSSL lookup fallback"
          s = s.replace(old, new)
          old = "        CRYPTO_THREAD_unlock(bio_lookup_lock);\n    }\n\n    return ret;"
          new = "        CRYPTO_THREAD_unlock(bio_lookup_lock);\n#endif\n    }\n\n    return ret;"
          assert s.count(old) == 1, "unexpected OpenSSL lookup fallback ending"
          p.write_text(s.replace(old, new))
          PY
            # libctru has no SO_KEEPALIVE. Do not request it by default,
            # and report failure if a caller explicitly asks for it.
            python3 - <<'PY'
          from pathlib import Path
          p = Path("crypto/bio/bio_sock2.c")
          s = p.read_text()
          old = "\n".join(["    if (options & BIO_SOCK_KEEPALIVE) {",
                           "        if (setsockopt(sock, SOL_SOCKET, SO_KEEPALIVE,",
                           "                (const void *)&on, sizeof(on))",
                           "            != 0) {",
                           "            ERR_raise_data(ERR_LIB_SYS, get_last_socket_error(),",
                           '                "calling setsockopt()");',
                           "            ERR_raise(ERR_LIB_BIO, BIO_R_UNABLE_TO_KEEPALIVE);",
                           "            return 0;",
                           "        }",
                           "    }"])
          new = old.replace("        if (setsockopt", "#ifdef SO_KEEPALIVE\n        if (setsockopt", 1)
          new = new[:-5] + "#else\n        ERR_raise(ERR_LIB_BIO, BIO_R_UNABLE_TO_KEEPALIVE);\n        return 0;\n#endif\n    }"
          assert s.count(old) == 2, "unexpected OpenSSL keepalive blocks"
          p.write_text(s.replace(old, new))
          p = Path("crypto/bio/bss_conn.c")
          s = p.read_text()
          old = "            if (BIO_ADDRINFO_socktype(c->addr_iter) == SOCK_STREAM)\n                opts |= BIO_SOCK_KEEPALIVE;"
          assert s.count(old) == 1, "unexpected OpenSSL default keepalive"
          p.write_text(s.replace(old, "#ifdef SO_KEEPALIVE\n" + old + "\n#endif"))
          PY
            # Native OS entropy: use the ssl:C random service, as devkitPro's
            # Mbed TLS port does. Never credit bytes on a failed service call.
            python3 - <<'PY'
          from pathlib import Path
          p = Path("providers/implementations/rands/seeding/rand_unix.c")
          s = p.read_text()
          old = "#else\n\n#if defined(OPENSSL_RAND_SEED_EGD) && (defined(OPENSSL_NO_EGD) || !defined(DEVRANDOM_EGD))"
          new = """#elif defined(__3DS__)

          #ifndef OPENSSL_RAND_SEED_OS
          #error "Nintendo 3DS requires native OS entropy"
          #endif
          #include <3ds/types.h>
          #include <3ds/result.h>
          #include <3ds/synchronization.h>
          #include <3ds/services/sslc.h>

          /* libctru LightLock uses 1 as the unlocked state. Serialize the
           * sslc reference-count lifecycle even across concurrent DRBGs. */
          static LightLock entropy_lock = 1;

          size_t ossl_pool_acquire_entropy(RAND_POOL *pool)
          {
              size_t n = ossl_rand_pool_bytes_needed(pool, 1);
              unsigned char *buffer;
              Result rc;

              if (n == 0)
                  return ossl_rand_pool_entropy_available(pool);
              if (n > UINT32_MAX || n > SIZE_MAX / 8)
                  return 0;
              buffer = ossl_rand_pool_add_begin(pool, n);
              if (buffer == NULL)
                  return 0;

              LightLock_Lock(&entropy_lock);
              rc = sslcInit(0);
              if (R_SUCCEEDED(rc)) {
                  rc = sslcGenerateRandomData(buffer, (u32)n);
                  sslcExit();
              }
              LightLock_Unlock(&entropy_lock);

              if (R_FAILED(rc)) {
                  OPENSSL_cleanse(buffer, n);
                  ossl_rand_pool_add_end(pool, 0, 0);
                  return 0;
              }
              if (!ossl_rand_pool_add_end(pool, n, 8 * n)) {
                  OPENSSL_cleanse(buffer, n);
                  return 0;
              }
              return ossl_rand_pool_entropy_available(pool);
          }

          int ossl_rand_pool_init(void)
          {
              return 1;
          }

          void ossl_rand_pool_cleanup(void)
          {
          }

          void ossl_rand_pool_keep_random_devices_open(int keep)
          {
              (void)keep;
          }

          """ + old
          assert s.count(old) == 1, "unexpected OpenSSL entropy backend"
          p.write_text(s.replace(old, new))
          PY
            # Generic ARM/newlib target, not a Linux target. Keep thread safety
            # and OS entropy enabled; runtime entropy and TLS need hardware validation.
            cat > Configurations/99-nintendo-3ds.conf <<'EOF'
          my %targets = (
              "nintendo-3ds" => {
                  inherit_from => [ "gcc" ],
                  thread_scheme => "pthreads",
                  ex_libs => add("-lctru -lm"),
                  cflags => "-march=armv6k -mtune=mpcore -mfloat-abi=hard -mtp=soft -mword-relocations -ffunction-sections -fdata-sections",
              },
          );
          EOF
            CC=arm-none-eabi-gcc AR=arm-none-eabi-ar RANLIB=arm-none-eabi-ranlib \
              perl Configure nintendo-3ds --prefix="$prefix" --libdir=lib \
                --openssldir=sdmc:/3ds/lagrange/openssl \
                -D__3DS__ -DOPENSSL_USE_IPV6=0 -DOPENSSL_NO_UNIX_SOCK -DNO_SYSLOG -I"$DEVKITPRO/libctru/include" -I"$prefix/include" \
                no-shared no-dso no-module no-asm no-async no-engine no-tests no-apps \
                no-thread-pool no-ui-console no-quic --with-rand-seed=os
            # Keep compiling independent objects after errors to collect more diagnostics.
            # make still returns failure, so incomplete libraries are never installed.
            make -k -j2 build_libs
            make install_dev
            "$prefix/bin/arm-none-eabi-pkg-config" --modversion openssl
            arm-none-eabi-objdump -f "$prefix/lib/libcrypto.a" > "$GITHUB_WORKSPACE/port-report/openssl-architecture.txt"
          ) 2>&1 | tee port-report/openssl-build.log

      - name: Link OpenSSL RNG and TLS probe for Nintendo 3DS
        if: ${{ !cancelled() && steps.openssl.outcome == 'success' }}
        run: |
          set -euo pipefail
          (
            export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/3ds/bin:$PATH"
            mkdir -p /tmp/3ds-tls-probe
            cat > /tmp/3ds-tls-probe/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.15)
          project(lagrange_3ds_tls_probe C)
          set(OPENSSL_USE_STATIC_LIBS TRUE)
          find_package(OpenSSL REQUIRED)
          add_executable(lagrange-3ds-tls-probe main.c)
          target_link_libraries(lagrange-3ds-tls-probe PRIVATE OpenSSL::SSL OpenSSL::Crypto ctru m)
          ctr_create_3dsx(lagrange-3ds-tls-probe)
          EOF
            cat > /tmp/3ds-tls-probe/main.c <<'EOF'
          #include <openssl/rand.h>
          #include <openssl/ssl.h>
          int main(void)
          {
              unsigned char random[32];
              if (RAND_bytes(random, sizeof(random)) != 1)
                  return 1;
              OPENSSL_cleanse(random, sizeof(random));
              SSL_CTX *ctx = SSL_CTX_new(TLS_client_method());
              if (ctx == NULL)
                  return 2;
              SSL_CTX_free(ctx);
              return 0;
          }
          EOF
            cmake -S /tmp/3ds-tls-probe -B /tmp/3ds-tls-build \
              -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake" \
              -DCMAKE_BUILD_TYPE=Release
            cmake --build /tmp/3ds-tls-build --parallel 2
            test -s /tmp/3ds-tls-build/lagrange-3ds-tls-probe.3dsx
            cp /tmp/3ds-tls-build/lagrange-3ds-tls-probe.3dsx port-report/
            sha256sum port-report/*.3dsx > port-report/SHA256SUMS
          ) 2>&1 | tee port-report/openssl-link.log

      - name: Probe unmodified Lagrange configuration
        if: ${{ !cancelled() && steps.unistring.outcome == 'success' && steps.pcre2.outcome == 'success' && steps.openssl.outcome == 'success' }}
        run: |
          set -euo pipefail
          export PATH="$DEVKITARM/bin:$DEVKITPRO/tools/bin:$DEVKITPRO/portlibs/3ds/bin:$PATH"
          export PKG_CONFIG_PATH=
          export PKG_CONFIG_LIBDIR="$DEVKITPRO/portlibs/3ds/lib/pkgconfig:$DEVKITPRO/portlibs/armv6k/lib/pkgconfig"
          cmake -S . -B /tmp/lagrange-3ds-build \
            -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/3DS.cmake" \
            -DCMAKE_BUILD_TYPE=Release -DENABLE_STATIC=ON \
            -DENABLE_GUI=ON -DENABLE_TUI=OFF -DINSTALL_GMGET=OFF \
            -DENABLE_X11_XLIB=OFF -DENABLE_HARFBUZZ=OFF \
            -DUNISTRING_DIR="$DEVKITPRO/portlibs/3ds" \
            2>&1 | tee port-report/lagrange-configure.log
          cmake --build /tmp/lagrange-3ds-build --parallel 2 \
            2>&1 | tee port-report/lagrange-build.log

      - name: Upload diagnostics and smoke-test binary if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 3ds-port-probe
          path: port-report/
          if-no-files-found: warn
          retention-days: 14
